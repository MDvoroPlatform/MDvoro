name: MDvoro Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: |
          test -f package-lock.json || (echo 'package-lock.json is required for deterministic CI.' && exit 1)
          npm ci --no-audit --no-fund
      - run: npm run verify
